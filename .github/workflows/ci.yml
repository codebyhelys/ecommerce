name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce_user
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_user -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Roda com DEBUG=False para exercitar os padrões de produção (só desliga o que exige HTTPS).
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      DB_NAME: ecommerce
      DB_USER: ecommerce_user
      DB_PASSWORD: ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Checagens do Django
        run: python manage.py check

      - name: Migrations em dia
        run: python manage.py makemigrations --check --dry-run

      - name: Checagens de produção (só erros reprovam)
        run: python manage.py check --deploy --fail-level ERROR

      - name: Testes
        run: python manage.py test --noinput
